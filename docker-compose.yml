services:
  postgres-db:
    image: postgres:15-alpine
    container_name: express_postgres_container
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      # host port : container port
      - "${POSTGRES_PORT}:5432"
    volumes:
      # host disk : container disk bind port
      - pgdata:/var/lib/postgresql/data
    # check healthly services
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      # host : container
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    # check NODE_ENV if then else ปิดด้วย fi         !!! careful this command !!!
    command: >-
      sh -c 'if [ "$$NODE_ENV" = "development" ]; then npm install && npm run dev; else npm install --omit=dev && npm start; fi'
    ports:
      - "${BACKEND_PORT}:5000"
    # wait for services
    depends_on:
      postgres-db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --force"
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_node_modules:
  frontend_node_modules:
